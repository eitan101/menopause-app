<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ניהול גיל המעבר – מערכת קלינית תומכת החלטה (Zero-Server CDSS)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      if (window.location.protocol === 'file:') {
        window.location.replace('./standalone.html');
      } else {
        window.addEventListener('DOMContentLoaded', function () {
          setTimeout(function () {
            if (!window.__MENOPAUSE_APP_MOUNTED__ && !window.location.pathname.endsWith('standalone.html')) {
              window.location.replace('./standalone.html');
            }
          }, 1500);
        });
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
